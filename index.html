<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF9F6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Nossa Reforma" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <script>
      // Mostra na tela qualquer erro que aconteça antes do app abrir
      window.addEventListener('error', function (e) {
        var root = document.getElementById('root');
        if (root && !root.hasChildNodes()) {
          root.innerHTML = '<div style="padding:24px;font-family:system-ui,sans-serif"><h1 style="font-size:20px;font-weight:800">Ops, o app não abriu 😕</h1><p>Tire um print e mande para o Claude:</p><pre style="white-space:pre-wrap;background:#f5f5f4;padding:12px;border-radius:12px;font-size:12px"></pre></div>';
          root.querySelector('pre').textContent = (e.message || 'Erro') + '\n' + (e.filename || '') + ':' + (e.lineno || '');
        }
      });
    </script>
    <title>Nossa Reforma</title>
  </head>
  <body class="bg-creme">
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
